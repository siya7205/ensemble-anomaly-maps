name: Metrics Computation Tests

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'tools/compute_presentation_metrics.py'
      - 'tests/test_compute_presentation_metrics.py'
      - 'tests/sample_predictions.csv'
      - 'requirements_metrics.txt'
      - '.github/workflows/metrics.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/compute_presentation_metrics.py'
      - 'tests/test_compute_presentation_metrics.py'
      - 'tests/sample_predictions.csv'
      - 'requirements_metrics.txt'
      - '.github/workflows/metrics.yml'

permissions:
  contents: read

jobs:
  test-metrics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
      
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements_metrics.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_metrics.txt
          pip install pytest
      
      - name: Run metrics computation tests
        run: |
          pytest tests/test_compute_presentation_metrics.py -v --tb=short
      
      - name: Run sample metrics computation
        run: |
          python tools/compute_presentation_metrics.py \
            --predictions tests/sample_predictions.csv \
            --out-dir test_outputs \
            --bootstrap 200 \
            --seed 42
      
      - name: Verify output files
        run: |
          echo "Checking output files..."
          test -f test_outputs/metrics_summary.csv && echo "✓ metrics_summary.csv exists"
          test -f test_outputs/predictions_roc.png && echo "✓ predictions_roc.png exists"
          test -f test_outputs/predictions_pr.png && echo "✓ predictions_pr.png exists"
          test -f test_outputs/score_distributions.png && echo "✓ score_distributions.png exists"
          echo ""
          echo "Metrics summary:"
          cat test_outputs/metrics_summary.csv
      
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4.4.0
        if: always()
        with:
          name: metrics-test-outputs
          path: |
            test_outputs/metrics_summary.csv
            test_outputs/*.png
          retention-days: 7
