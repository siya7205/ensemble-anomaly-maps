<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Interactive Molecular Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #0a0e27;
      color: #e4e6eb;
      overflow: hidden;
    }

    #container {
      display: flex;
      height: 100vh;
    }

    #viewer-container {
      flex: 1;
      position: relative;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    #sidebar {
      width: 340px;
      background: #1a1f3a;
      border-left: 1px solid #2a3352;
      overflow-y: auto;
      padding: 20px;
    }

    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(26, 31, 58, 0.95);
      border: 1px solid #2a3352;
      border-radius: 8px;
      padding: 15px;
      min-width: 280px;
      backdrop-filter: blur(10px);
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    select, input[type="range"], button {
      width: 100%;
      padding: 8px 12px;
      background: #0f1729;
      border: 1px solid #2a3352;
      border-radius: 6px;
      color: #e4e6eb;
      font-size: 14px;
    }

    select:hover, button:hover {
      border-color: #3b4563;
      background: #151d35;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button.active {
      background: #2563eb;
      border-color: #3b82f6;
    }

    input[type="range"] {
      padding: 0;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #2563eb;
      cursor: pointer;
      border-radius: 50%;
    }

    input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      background: #2563eb;
      cursor: pointer;
      border-radius: 50%;
      border: none;
    }

    .slider-value {
      font-size: 12px;
      color: #9ca3af;
      text-align: right;
      margin-top: 4px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #e4e6eb;
    }

    h3 {
      font-size: 14px;
      margin: 15px 0 8px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-item {
      background: #0f1729;
      border: 1px solid #2a3352;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .info-label {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 15px;
      color: #e4e6eb;
      font-weight: 600;
      margin-top: 2px;
    }

    .legend {
      margin-top: 20px;
      padding: 12px;
      background: #0f1729;
      border: 1px solid #2a3352;
      border-radius: 6px;
    }

    .legend-title {
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .legend-gradient {
      height: 20px;
      border-radius: 4px;
      background: linear-gradient(to right, #3b82f6, #ffffff, #ef4444);
      margin-bottom: 6px;
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6b7280;
    }

    #status {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(26, 31, 58, 0.95);
      border: 1px solid #2a3352;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #9ca3af;
      backdrop-filter: blur(10px);
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      z-index: 1000;
      max-width: 250px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .spinner {
      border: 3px solid #2a3352;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="viewer-container">
      <div id="viewer"></div>
      
      <div id="controls">
        <div class="control-group">
          <label>Visualization Mode</label>
          <select id="vizMode">
            <option value="spheres">Atoms (Spheres)</option>
            <option value="ball-stick">Ball and Stick</option>
            <option value="ribbon">Ribbon (Cartoon)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Color Mode</label>
          <select id="colorMode">
            <option value="hotspot">Hotspot Score</option>
            <option value="rmsf">RMSF (Flexibility)</option>
            <option value="residue">Residue Type</option>
            <option value="chain">Chain</option>
          </select>
        </div>

        <div class="control-group">
          <label>Frame</label>
          <input type="range" id="frameSlider" min="0" max="0" value="0" step="1" />
          <div class="slider-value">Frame: <span id="frameValue">0</span> / <span id="frameMax">0</span></div>
        </div>

        <div class="control-group">
          <label>Clipping Plane</label>
          <button id="toggleClipping">Enable Clipping</button>
        </div>

        <div id="clippingControls" style="display: none;">
          <div class="control-group">
            <label>Plane Position</label>
            <input type="range" id="clipPosition" min="-50" max="50" value="0" step="0.5" />
            <div class="slider-value">Position: <span id="clipPosValue">0</span></div>
          </div>

          <div class="control-group">
            <label>Plane Axis</label>
            <select id="clipAxis">
              <option value="x">X-Axis</option>
              <option value="y">Y-Axis</option>
              <option value="z">Z-Axis</option>
            </select>
          </div>
        </div>
      </div>

      <div id="status">Initializing...</div>
      <div id="tooltip"></div>
    </div>

    <div id="sidebar">
      <h2>Molecule Info</h2>
      <div class="info-item">
        <div class="info-label">Frames</div>
        <div class="info-value" id="infoFrames">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">Atoms</div>
        <div class="info-value" id="infoAtoms">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">Residues</div>
        <div class="info-value" id="infoResidues">-</div>
      </div>

      <div class="legend">
        <div class="legend-title">Color Scale</div>
        <div class="legend-gradient"></div>
        <div class="legend-labels">
          <span>Low</span>
          <span>Medium</span>
          <span>High</span>
        </div>
      </div>

      <h3>Selected Residue</h3>
      <div id="residueInfo">
        <p style="color: #6b7280; font-size: 13px; font-style: italic;">
          Click on an atom to view details
        </p>
      </div>
    </div>
  </div>

  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/static/js/interactive_viewer.js"></script>
</body>
</html>
